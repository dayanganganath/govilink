name: Backend CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "test/**"
      - "ci/**"
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Java 17 / PostgreSQL 18
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: govilink_test
          POSTGRES_USER: govilink_ci
          POSTGRES_PASSWORD: govilink_ci_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U govilink_ci -d govilink_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/govilink_test
      SPRING_DATASOURCE_USERNAME: govilink_ci
      GOVILINK_DB_PASSWORD: govilink_ci_disposable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Verify Java and Maven
        run: |
          java -version
          bash ./mvnw --version

      - name: Run tests and package application
        run: bash ./mvnw --batch-mode --no-transfer-progress verify